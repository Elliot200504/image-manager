<VirtualHost *:80>
    DocumentRoot ${APACHE_DOCUMENT_ROOT}

    <Directory ${APACHE_DOCUMENT_ROOT}>
        Options -Indexes +FollowSymLinks
        AllowOverride None
        Require all granted

        DirectoryIndex index.php
    </Directory>

    # Belt and braces: data/ and storage/ already sit outside the document root,
    # but if someone later moves the root up a level, this keeps them closed.
    <DirectoryMatch "^/var/www/html/(src|data|storage|docker)">
        Require all denied
    </DirectoryMatch>

    # Nothing under assets/ is ever executable. Without this, a bug that let a
    # .php file land in an asset directory would still not run it.
    <Directory ${APACHE_DOCUMENT_ROOT}/assets>
        php_flag engine off
        <FilesMatch "\.(?i:php|phar|phtml)$">
            Require all denied
        </FilesMatch>
    </Directory>

    # Long cache for fingerprint-free static assets is deliberately avoided —
    # this app has no build step to fingerprint them, so a short max-age keeps
    # CSS and JS changes visible without a hard refresh.
    <FilesMatch "\.(?i:css|js)$">
        Header set Cache-Control "public, max-age=300"
    </FilesMatch>

    # ServerTokens is server-config context only and would abort startup here;
    # it is set in the main config instead (see the Dockerfile).
    ServerSignature Off

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
