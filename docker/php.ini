; FileShare PHP settings.
;
; These must stay at or above MAX_UPLOAD_MB in docker-compose.yml. PHP discards
; the request body before the script runs when post_max_size is exceeded, so if
; these were lower the app's own limit and error message would never be reached.

upload_max_filesize = 64M
post_max_size = 68M
memory_limit = 256M
max_execution_time = 120

; Large uploads need the time; keep input parsing bounded all the same.
max_input_time = 120
max_file_uploads = 5

; Never render errors into a response — they leak paths and code. Logs only.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL

; The version header is free reconnaissance.
expose_php = Off

; Session hardening. The cookie flags themselves are set in bootstrap.php so
; they also apply outside Docker.
session.use_strict_mode = 1
session.cookie_httponly = 1
session.cookie_samesite = Lax
session.use_only_cookies = 1

date.timezone = UTC
